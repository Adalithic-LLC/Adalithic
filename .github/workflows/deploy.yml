name: Deploy to GitHub Pages

# Builds the Vite app and deploys the result to GitHub Pages on every push to
# main, so editing the React source is enough — no manual `vite build` and
# copy-to-root step required.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, and let an in-progress deployment
# finish rather than cancelling it. Cancelling a Pages deploy mid-flight (the
# deploy-pages step creates a real deployment on GitHub's backend) can leave the
# github-pages environment with a stuck deployment, after which subsequent runs
# fail with "Deployment failed, try again later". This matches GitHub's official
# Pages workflow, which sets cancel-in-progress: false for exactly this reason.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # /redeem talks to Supabase from the browser. Both values are PUBLIC (the
      # anon key is a publishable key constrained by RLS, and the same pair
      # ships inside the Arcatext iOS binary) but they are injected here rather
      # than committed, because this repo is public and a key in git history is
      # painful to rotate. Set them as either repository secrets or repository
      # variables — the fallback below accepts whichever exists.
      - run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      # Preserve the custom domain, disable Jekyll processing, and add SPA
      # fallbacks. GitHub Pages has no server-side routing, so a direct hit on a
      # client-only route (e.g. /terms, /privacy — the URLs the Arcatext app and
      # the footer link to) would otherwise 404.
      #
      # Two layers:
      # 1. Real terms.html / privacy.html (and per-locale copies) so GitHub Pages
      #    serves /terms, /privacy, /es/privacy, ... as true HTTP 200s (important:
      #    these URLs are linked from the app and submitted to the App Store /
      #    Google Play, which can flag a 404-status URL). Assets load via the
      #    absolute vite `base: "/"`, so a copy of index.html works at any depth.
      # 2. 404.html as a catch-all for any other client route (renders the app
      #    with a 404 status; browsers still route it correctly).
      #
      # LOCALES must stay in sync with PREFIX_LOCALES in client/src/lib/locale.ts.
      - name: Add CNAME, .nojekyll, and SPA fallbacks
        run: |
          echo "adalithic.com" > dist/public/CNAME
          touch dist/public/.nojekyll
          cp dist/public/index.html dist/public/404.html
          cp dist/public/index.html dist/public/terms.html
          cp dist/public/index.html dist/public/privacy.html
          # Promo redemption. Needs the per-locale copies below as well as this
          # one: detect-locale rewrites an unprefixed path to the visitor's
          # browser locale, so a Spanish visitor handed /redeem lands on
          # /es/redeem and would 404 without a real file there.
          cp dist/public/index.html dist/public/redeem.html
          for L in es fr de ja it pl nl pt zh ko tr el ar he sv cs ro hu da fi no bg vi th id hi ru uk zh-Hant bn ta te mr ur fa ms fil sw pa; do
            mkdir -p "dist/public/$L"
            cp dist/public/index.html "dist/public/$L/index.html"
            cp dist/public/index.html "dist/public/$L/privacy.html"
            cp dist/public/index.html "dist/public/$L/terms.html"
            cp dist/public/index.html "dist/public/$L/redeem.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
